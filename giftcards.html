<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Cards | Market369</title>
    <link rel="icon" type="image/x-icon" href="img/iconoMarket369.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo-link">
                <img src="img/logoMarket369.jpeg" alt="Logo Market369" class="logo-img">
            </a>
            <div class="header-actions">
                <button id="btn-login-header" class="btn-auth">
                    <span id="nombre-usuario-header">Ingresar</span>
                </button>
                <div class="cart" title="Ver carrito">
                    <span id="contador-carrito">0</span>
                    🛒
                </div>
                <button id="btn-logout" class="btn-logout oculto" title="Cerrar Sesión">🚪</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="seccion-productos">
            <h1 class="titulo-seccion">Nuestras Gift Cards</h1>
            <div class="grid-productos">
                </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-info">
                <h3>Market369</h3>
                <p>Tu tienda de tecnología y gift cards al mejor precio.</p>
            </div>
            <div class="footer-contacto">
                <p>📧 info@market369.com.ar</p>
                <p>📱 +54 9 11 2345-6789</p>
            </div>
            <div class="footer-redes">
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">Facebook</a>
            </div>
        </div>
    </footer>

    <div id="overlay-carrito" class="overlay oculto"></div>
    <div id="carrito-lateral" class="carrito-panel carrito-oculto">
        <div class="header-carrito">
            <h3>Tu Carrito</h3>
            <button id="btn-cerrar-carrito">&times;</button>
        </div>
        <div id="lista-carrito"></div>
        <div class="footer-carrito">
            <div class="total">Total: <span id="total-precio">$0,00</span></div>
            <button id="btn-vaciar-carrito" class="btn-vaciar" style="display:none;">Vaciar Carrito</button>
            <button id="btn-pagar" class="btn-pagar" disabled>Ir a Pagar</button>
        </div>
    </div>

    <div id="overlay-checkout" class="overlay oculto">
        <div class="modal-checkout">
            <button id="btn-cerrar-checkout" class="btn-cerrar-modal">&times;</button>
            <div class="tabs-auth">
                <button id="tab-login" class="tab-btn activa">Ingresar</button>
                <button id="tab-registro" class="tab-btn">Registrarse</button>
            </div>
            <form id="form-checkout">
                <div class="campo-registro" style="display:none;">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre">
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div>
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <div class="campo-registro" style="display:none;">
                    <label>Dirección de Envío</label>
                    <input type="text" id="direccion">
                </div>
                <button type="submit" id="btn-confirmar-datos" class="btn-principal">Ingresar a mi cuenta</button>
            </form>
        </div>
    </div>

    <button id="btn-chatbot" class="btn-chatbot" title="¿Necesitas ayuda?">💬</button>
    <div id="ventana-chat" class="ventana-chat chat-oculto">
        <div class="header-chat">
            <span>Asistente Virtual</span>
            <button id="btn-cerrar-chat">&times;</button>
        </div>
        <div id="chat-mensajes" class="chat-mensajes"></div>
        <div class="footer-chat">
            <input type="text" id="input-chat" placeholder="Escribe tu duda...">
            <button id="btn-enviar-chat">🚀</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
